services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: noter-postgres
    restart: unless-stopped
    ports:
      - "5433:5432" # Development port (to avoid conflicts with a local PostgreSQL)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_change_me}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - noter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d noter"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Database Migration Service
  migrate:
    build: .
    container_name: noter-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: ${GOOSE_DRIVER:-postgres}
      GOOSE_DBSTRING: ${GOOSE_DBSTRING:-postgres://noter_admin:admin@postgres:5432/noter?sslmode=disable}
      GOOSE_MIGRATION_DIR: ${GOOSE_MIGRATION_DIR:-./db/schema/migrations}
      GOOSE_SEED_DIR: ${GOOSE_SEED_DIR:-./db/schema/seed}
      GOOSE_TABLE: ${GOOSE_TABLE:-goose_migrations}
    networks:
      - noter-network
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        goose -dir db/schema/migrations up &&
        echo 'Running seed data...' &&
        goose -dir db/schema/seed -no-versioning up &&
        echo 'Database setup complete!'
      "
    restart: "no"
    profiles:
      - migrate

  # Web Application
  web:
    build: .
    container_name: noter-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: 4444
      DB_DSN: ${DB_DSN:-postgres://noter_web:pass@postgres:5432/noter?sslmode=disable}
      ENVIROMENT: ${ENVIROMENT:-development}
      DEBUG: ${DEBUG:-true}
      TLS_CERT: ${TLS_CERT:-./tls/cert.pem}
      TLS_KEY: ${TLS_KEY:-./tls/key.pem}
    ports:
      - "4444:4444"
    volumes:
      # Mount source code for development (enables live reload)
      - .:/app
    working_dir: /app
    networks:
      - noter-network
    entrypoint: ["./scripts/entrypoint.sh"]
    command:
      [
        "-addr",
        "0.0.0.0:4444",
        "-env",
        "${ENVIROMENT:-development}",
        "-dsn",
        "${DB_DSN:-postgres://noter_web:pass@postgres:5432/noter?sslmode=disable}",
        "-tls-cert",
        "${TLS_CERT:-./tls/cert.pem}",
        "-tls-key",
        "${TLS_KEY:-./tls/key.pem}",
      ]

  # Development tools service for running linting, testing, etc.
  tools:
    build: .
    container_name: noter-tools
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    working_dir: /app
    networks:
      - noter-network
    environment:
      TEST_DB_DSN: ${TEST_DB_DSN:-postgres://noter_test_web:test_pass@postgres:5432/noter_test?sslmode=disable}
    profiles:
      - tools
    command: ["tail", "-f", "/dev/null"] # Keep container running

volumes:
  go_mod_cache:
    driver: local
  pg_data:
    driver: local

networks:
  noter-network:
    driver: bridge
