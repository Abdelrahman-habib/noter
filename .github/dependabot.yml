version: 2

updates:
  # Go modules (go.mod / go.sum)
  # go.tool.mod (staticcheck, govulncheck) is not tracked by Dependabot;
  # bump manually with make upgrade-tool.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"

    # One PR for minor+patch across all deps; majors stay separate so
    # breaking changes get reviewed on their own.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image in the root Dockerfile (both FROM stages in one PR)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # Uncomment when CI workflows land under .github/workflows/
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 3
  #   labels:
  #     - "dependencies"
  #   commit-message:
  #     prefix: "deps"
